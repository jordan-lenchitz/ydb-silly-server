services:
  ydb-silly-server:
    build: .
    container_name: ydb-silly-server
    hostname: ydb-silly-server
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./ydb-data/container:/data
    environment:
      - PORT=8080
      - YDB_MUMPS_PORT=8081
      - ydb_dir=/data
      - ydb_chset=UTF-8
    ipc: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
