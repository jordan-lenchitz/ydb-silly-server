name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'

    - name: Install YottaDB Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gcc make pkg-config libicu-dev libncurses5-dev

    - name: Install YottaDB
      run: |
        wget https://gitlab.com/YottaDB/DB/YDB/-/raw/master/sr_unix/ydbinstall.sh
        chmod +x ydbinstall.sh
        sudo ./ydbinstall.sh --utf8 default --verbose

    - name: Set YottaDB Environment
      run: |
        echo "PKG_CONFIG_PATH=/usr/share/pkgconfig:/usr/local/lib/pkgconfig" >> $GITHUB_ENV
        # We need to find where ydb_env_set is.
        # The installer log says it's at /usr/local/lib/yottadb/r206
        YDB_DIST=$(find /usr/local/lib/yottadb -name ydb_env_set -exec dirname {} \; 2>/dev/null | head -n 1)
        if [ -z "$YDB_DIST" ]; then
          YDB_DIST=$(find /opt/yottadb -name ydb_env_set -exec dirname {} \; 2>/dev/null | head -n 1)
        fi
        echo "YDB_DIST=$YDB_DIST" >> $GITHUB_ENV

    - name: Build
      run: |
        export ydb_chset=UTF-8
        if [ -f "$YDB_DIST/ydb_env_set" ]; then
          . "$YDB_DIST/ydb_env_set"
        fi
        export ydb_routines="$PWD/mumps $ydb_routines"
        cd go && go build -v ./...

    - name: Test MUMPS & Go
      run: |
        export ydb_chset=UTF-8
        if [ -f "$YDB_DIST/ydb_env_set" ]; then
          . "$YDB_DIST/ydb_env_set"
        fi
        export ydb_routines="$PWD/mumps $ydb_routines"
        "$YDB_DIST/yottadb" -run ^XEXE
        "$YDB_DIST/yottadb" -run ^ZTEST
        cd go && go test -v ./...

    - name: Log in to GitHub Container Registry (ghcr.io)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push x86_64 image to ghcr.io
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        rm -f ydbinstall.sh mumps/ZEMOJI.m mumps/*.o
        IMAGE_REPO="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
        docker build --platform linux/amd64 --provenance=false \
          -t "${IMAGE_REPO}:latest" \
          -t "${IMAGE_REPO}:${{ github.sha }}" .
        for tag in "latest" "${{ github.sha }}"; do
          for attempt in 1 2 3; do
            docker push "${IMAGE_REPO}:${tag}" && break
            echo "Retrying push for ${tag} (attempt ${attempt})..."
            sleep 3
          done
        done
